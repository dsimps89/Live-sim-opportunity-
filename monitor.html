<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Simulation API Monitor</title><style>body{font:16px system-ui;background:#0a1425;color:#edf6ff;padding:25px}input{width:100%;padding:12px;background:#152942;color:white;border:1px solid #456}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#13243b;padding:15px;border-radius:10px}</style><h1>Chatham-Kent API Monitor</h1><p>Paste the public Worker feed URL (no token needed). Polls every 10 seconds.</p><input id="url" placeholder="https://your-worker.workers.dev/api/live"><p id="status">Waiting for URL</p><pre id="output"></pre><script>const u=document.getElementById('url'),s=document.getElementById('status'),o=document.getElementById('output');u.value=localStorage.getItem('ck_monitor_url')||'';async function poll(){if(!/^https:\/\//.test(u.value.trim()))return;try{localStorage.setItem('ck_monitor_url',u.value.trim());const r=await fetch(u.value.trim(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();s.textContent='Status: '+d.status+' | Age: '+(d.ageSeconds??'—')+' seconds | Checked: '+new Date().toLocaleTimeString();o.textContent=JSON.stringify(d,null,2)}catch(e){s.textContent='Unavailable: '+e.message}}u.onchange=poll;poll();setInterval(poll,10000)</script></html>
